name: 'transactions_analytics'
version: '1.0.0'
config-version: 2
profile: 'transactions_analytics'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  catalog: "dev"

models:
  transactions_analytics:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: incremental
      +file_format: delta
      +on_schema_change: sync_all_columns
      +schema: silver
      +persist_docs:
        relation: true
        columns: true

seeds:
  transactions_analytics:
    +schema: seeds
